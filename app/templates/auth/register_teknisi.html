{% extends "base.html" %}
{% block title %}Daftarkan Teknisi{% endblock %}
{% block content %}
<div class="card">
    <h1>Daftarkan Teknisi baru</h1>
    <p class="subtitle">Teknisi yang kamu daftarkan otomatis masuk district {{ current_user.district }} dan bisa langsung masuk.</p>

    <form method="POST">
        <label for="name">Nama lengkap</label>
        <input type="text" id="name" name="name" required autofocus>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password sementara</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Daftarkan</button>
    </form>
</div>
{% endblock %}
