{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<div class="card">
    <h1>Masuk</h1>
    <p class="subtitle">Masuk untuk mencatat dan melacak riwayat aset perangkat.</p>

    <form method="POST">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Masuk</button>
    </form>

    <p class="form-footer">
        Teknisi belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar di sini</a>.
    </p>
</div>
{% endblock %}
